services:
  db:
    image: postgres:15-alpine
    container_name: modalin-be-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment or configs/.env}
      POSTGRES_DB: modalin-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d modalin-db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modalin-be-app
    restart: on-failure
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment or configs/.env}
      DB_NAME: modalin-db
      DB_SSLMODE: disable
      DB_TIMEZONE: Asia/Jakarta
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or configs/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in your environment or configs/.env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [ "migrate" ]
    command: [ "./migrate" ]
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment or configs/.env}
      DB_NAME: modalin-db
      DB_SSLMODE: disable
      DB_TIMEZONE: Asia/Jakarta
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or configs/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in your environment or configs/.env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
